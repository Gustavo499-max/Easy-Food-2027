<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyFood Mobile</title>
  <style>
    :root{--orange:#ff6b35;--orange2:#ff8a4c;--ink:#1f2937;--muted:#7b8494;--bg:#f3f5f8;--card:#fff;--line:#edf0f4;--green:#18a66a}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eceff3,#fafafa);min-height:100vh;display:flex;justify-content:center;padding:20px;color:var(--ink)}
    button,input,select{font:inherit}
    button{border:0}
    .phone{width:390px;height:844px;background:var(--bg);border:8px solid #17191d;border-radius:42px;overflow:hidden;box-shadow:0 24px 65px #0002;display:flex;flex-direction:column;position:relative}
    .status{height:34px;padding:10px 22px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:800;background:#fff}
    .top{background:#fff;padding:10px 18px 16px;border-radius:0 0 26px 26px;box-shadow:0 8px 22px #1f293708;z-index:2}
    .topline{display:flex;align-items:center;justify-content:space-between}
    .location small{display:block;color:var(--muted);font-size:10px;margin-bottom:2px}.location strong{font-size:14px}.location strong span{color:var(--orange)}
    .avatar{width:38px;height:38px;border-radius:14px;background:#fff1eb;display:grid;place-items:center;font-size:20px}
    .hello{margin-top:15px}.hello h1{font-size:23px;line-height:1.15}.hello h1 span{color:var(--orange)}.hello p{font-size:12px;color:var(--muted);margin-top:5px}
    .search{margin-top:14px;display:flex;gap:8px}.searchbox{height:44px;background:var(--bg);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 13px;flex:1}.searchbox input{width:100%;border:0;outline:0;background:transparent;font-size:13px}.filter{width:44px;border-radius:14px;background:var(--orange);color:#fff;cursor:pointer;font-size:17px}
    .content{flex:1;overflow:auto;padding:16px 16px 95px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}
    .promo{min-height:120px;border-radius:22px;padding:18px;background:linear-gradient(120deg,#ff6b35,#ff9a5f);color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 25px #ff6b3530}.promo:after{content:'🍔';position:absolute;font-size:82px;right:-2px;bottom:-14px;transform:rotate(-10deg)}.promo small{font-weight:700;opacity:.85}.promo h2{font-size:21px;line-height:1.05;margin:5px 0 10px;width:62%}.promo button{padding:8px 12px;border-radius:10px;background:#fff;color:var(--orange);font-size:11px;font-weight:800;cursor:pointer}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 11px}.section-title h2{font-size:16px}.section-title button{background:none;color:var(--orange);font-size:11px;font-weight:800;cursor:pointer}
    .cats{display:flex;gap:9px;overflow:auto;padding-bottom:2px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{min-width:66px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:9px 8px;text-align:center;cursor:pointer;transition:.2s}.cat .emoji{width:37px;height:37px;border-radius:12px;background:#fff5f0;display:grid;place-items:center;margin:auto auto 5px;font-size:19px}.cat span:last-child{font-size:10px;font-weight:700;white-space:nowrap}.cat.active{background:var(--orange);color:#fff;border-color:var(--orange);transform:translateY(-1px)}.cat.active .emoji{background:#ffffff26}
    .sort-row{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.sort-row h2{font-size:16px}.sort-row select{border:0;background:transparent;color:var(--muted);font-size:11px;outline:none}
    .list{display:flex;flex-direction:column;gap:10px}.restaurant{background:#fff;border-radius:18px;padding:11px;display:flex;gap:12px;align-items:center;border:1px solid var(--line);box-shadow:0 6px 16px #1f293708;animation:up .25s ease}.foodpic{width:74px;height:74px;border-radius:16px;background:linear-gradient(145deg,#fff1e9,#ffe0cf);display:grid;place-items:center;font-size:35px;flex:none}.info{min-width:0;flex:1}.info h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info .meta{font-size:10px;color:var(--muted);margin:4px 0 7px}.tags{display:flex;align-items:center;gap:7px;font-size:10px}.rating{color:#e59a00;font-weight:800}.delivery{color:var(--green);font-weight:700}.heart{align-self:flex-start;width:30px;height:30px;border-radius:10px;background:#f7f7f8;color:#a7adb7;cursor:pointer;font-size:17px}.heart.on{color:#e8465b;background:#fff0f2}
    .empty,.error{text-align:center;padding:35px 15px;color:var(--muted);font-size:12px}.error{color:#c43d3d}.loader{text-align:center;padding:35px;color:var(--muted);font-size:12px}.spin{width:25px;height:25px;border:3px solid #e6e7ea;border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 9px}
    .bottom{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:7px 7px 10px;z-index:5}.nav{width:62px;background:none;color:#9aa1ac;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;cursor:pointer}.nav b{font-size:20px;font-weight:400}.nav.active{color:var(--orange);font-weight:800}.add-main{width:48px;height:48px;border-radius:17px;background:var(--orange);color:#fff;font-size:25px;box-shadow:0 8px 18px #ff6b3545;transform:translateY(-10px);cursor:pointer}
    .modal-wrap{display:none;position:absolute;inset:0;background:#11182780;z-index:10;align-items:flex-end}.modal-wrap.open{display:flex}.modal{width:100%;background:#fff;border-radius:26px 26px 0 0;padding:18px 18px 24px;animation:slide .25s ease}.handle{width:42px;height:4px;background:#ddd;border-radius:9px;margin:0 auto 15px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{font-size:18px}.close{background:#f3f4f6;width:32px;height:32px;border-radius:10px;cursor:pointer}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;height:43px;border:1px solid #e3e6ea;background:#f8f9fb;border-radius:12px;padding:0 12px;outline:none}.save{width:100%;height:45px;border-radius:13px;background:var(--orange);color:#fff;font-weight:800;margin-top:8px;cursor:pointer}.message{font-size:11px;text-align:center;margin-top:10px;min-height:15px}.message.ok{color:var(--green)}.message.bad{color:#c43d3d}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes up{from{opacity:0;transform:translateY(7px)}}@keyframes slide{from{transform:translateY(100%)}}
    @media(max-width:430px){body{padding:0;background:#fff}.phone{width:100%;height:100vh;border:0;border-radius:0}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="status"><span>9:41</span><span>●●● ︱ 🔋</span></div>
    <header class="top">
      <div class="topline"><div class="location"><small>ENTREGAR EM</small><strong>Minha localização <span>⌄</span></strong></div><div class="avatar">👤</div></div>
      <div class="hello"><h1>O que vamos <span>pedir hoje?</span></h1><p>Encontre restaurantes e sabores perto de você.</p></div>
      <div class="search"><label class="searchbox">🔎<input id="search" placeholder="Buscar restaurante..." /></label><button class="filter" id="sortButton">⇅</button></div>
    </header>

    <section class="content" id="homeView">
      <article class="promo"><small>OFERTA DO DIA</small><h2>Seu sabor favorito mais perto.</h2><button onclick="document.getElementById('restaurantsTitle').scrollIntoView({behavior:'smooth'})">Ver opções</button></article>
      <div class="section-title"><h2>Categorias</h2><button id="allCats">Ver todas</button></div>
      <div class="cats" id="categories">
        <button class="cat active" data-cat="Todos"><span class="emoji">🍽️</span><span>Todos</span></button>
        <button class="cat" data-cat="Burger"><span class="emoji">🍔</span><span>Burger</span></button>
        <button class="cat" data-cat="Pizza"><span class="emoji">🍕</span><span>Pizza</span></button>
        <button class="cat" data-cat="Sushi"><span class="emoji">🍣</span><span>Sushi</span></button>
        <button class="cat" data-cat="Saudável"><span class="emoji">🥗</span><span>Saudável</span></button>
        <button class="cat" data-cat="Japonesa"><span class="emoji">🍱</span><span>Japonesa</span></button>
        <button class="cat" data-cat="Italiana"><span class="emoji">🍝</span><span>Italiana</span></button>
      </div>
      <div class="sort-row" id="restaurantsTitle"><h2>Restaurantes</h2><select id="order"><option value="desc">Melhor avaliação</option><option value="asc">Menor avaliação</option></select></div>
      <div class="list" id="restaurantList"><div class="loader"><div class="spin"></div>Carregando restaurantes...</div></div>
    </section>

    <nav class="bottom">
      <button class="nav active" id="homeBtn"><b>⌂</b><span>Início</span></button>
      <button class="nav" id="searchBtn"><b>⌕</b><span>Buscar</span></button>
      <button class="add-main" id="openModal">＋</button>
      <button class="nav" id="favBtn"><b>♡</b><span>Favoritos</span></button>
      <button class="nav" id="profileBtn"><b>♙</b><span>Perfil</span></button>
    </nav>

    <div class="modal-wrap" id="modalWrap">
      <section class="modal">
        <div class="handle"></div><div class="modal-head"><h2>Novo restaurante</h2><button class="close" id="closeModal">✕</button></div>
        <form id="restaurantForm">
          <div class="field"><label>Nome</label><input id="name" required placeholder="Ex.: Sabor da Vila" /></div>
          <div class="field"><label>Categoria</label><select id="category" required><option value="">Selecione</option><option>Burger</option><option>Pizza</option><option>Sushi</option><option>Saudável</option><option>Japonesa</option><option>Italiana</option><option>Brasileira</option></select></div>
          <div class="field"><label>Avaliação</label><input id="rating" type="number" min="0" max="5" step="0.1" required placeholder="4.5" /></div>
          <button class="save" type="submit">Cadastrar restaurante</button><div class="message" id="message"></div>
        </form>
      </section>
    </div>
  </main>
<script>
  const API='/restaurants';
  const list=document.getElementById('restaurantList');
  const search=document.getElementById('search');
  const order=document.getElementById('order');
  const modal=document.getElementById('modalWrap');
  const emoji={Burger:'🍔',Pizza:'🍕',Sushi:'🍣','Saudável':'🥗',Japonesa:'🍱',Italiana:'🍝',Brasileira:'🍛'};
  let restaurants=[], selected='Todos', onlyFavorites=false;
  const favorites=new Set(JSON.parse(localStorage.getItem('easyfood-favorites')||'[]'));
  const saveFavs=()=>localStorage.setItem('easyfood-favorites',JSON.stringify([...favorites]));

  async function load(){
    list.innerHTML='<div class="loader"><div class="spin"></div>Carregando restaurantes...</div>';
    try{const r=await fetch(API); if(!r.ok)throw new Error(); restaurants=await r.json(); render();}
    catch(e){list.innerHTML='<div class="error">⚠️ Não foi possível conectar à API.<br>Inicie o projeto com <b>npm start</b>.</div>'}
  }
  function render(){
    let data=[...restaurants];
    const term=search.value.trim().toLowerCase();
    if(selected!=='Todos') data=data.filter(r=>r.category===selected);
    if(term) data=data.filter(r=>r.name.toLowerCase().includes(term));
    if(onlyFavorites) data=data.filter(r=>favorites.has(r.id));
    data.sort((a,b)=>order.value==='asc'?a.rating-b.rating:b.rating-a.rating);
    if(!data.length){list.innerHTML='<div class="empty">🍽️<br><br>Nenhum restaurante encontrado.</div>';return}
    list.innerHTML=data.map((r,i)=>`<article class="restaurant">
      <div class="foodpic">${emoji[r.category]||'🍴'}</div>
      <div class="info"><h3>${escapeHtml(r.name)}</h3><div class="meta">${escapeHtml(r.category)} • ${20+(r.id%3)*5}-${30+(r.id%3)*5} min</div><div class="tags"><span class="rating">★ ${Number(r.rating).toFixed(1)}</span><span>•</span><span class="delivery">Entrega R$ ${(3.5+(r.id%4)*1.25).toFixed(2).replace('.',',')}</span></div></div>
      <button class="heart ${favorites.has(r.id)?'on':''}" onclick="toggleFav(${r.id})">${favorites.has(r.id)?'♥':'♡'}</button>
    </article>`).join('');
  }
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  window.toggleFav=id=>{favorites.has(id)?favorites.delete(id):favorites.add(id);saveFavs();render()};
  document.querySelectorAll('.cat').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));btn.classList.add('active');selected=btn.dataset.cat;onlyFavorites=false;setNav('homeBtn');render()});
  search.addEventListener('input',render); order.addEventListener('change',render);
  document.getElementById('sortButton').onclick=()=>{order.value=order.value==='desc'?'asc':'desc';render()};
  document.getElementById('allCats').onclick=()=>{selected='Todos';document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.cat==='Todos'));render()};
  document.getElementById('openModal').onclick=()=>modal.classList.add('open');
  document.getElementById('closeModal').onclick=()=>modal.classList.remove('open');
  modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
  function setNav(id){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active')}
  document.getElementById('homeBtn').onclick=()=>{onlyFavorites=false;search.value='';setNav('homeBtn');render()};
  document.getElementById('searchBtn').onclick=()=>{onlyFavorites=false;setNav('searchBtn');search.focus();document.querySelector('.top').scrollIntoView({behavior:'smooth'})};
  document.getElementById('favBtn').onclick=()=>{onlyFavorites=true;setNav('favBtn');render()};
  document.getElementById('profileBtn').onclick=()=>{setNav('profileBtn');alert('Perfil demonstrativo do EasyFood.')};
  document.getElementById('restaurantForm').onsubmit=async e=>{
    e.preventDefault(); const msg=document.getElementById('message'); msg.className='message';msg.textContent='Salvando...';
    const payload={name:document.getElementById('name').value.trim(),category:document.getElementById('category').value,rating:Number(document.getElementById('rating').value)};
    try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await r.json();if(!r.ok)throw new Error(body.error||'Erro');restaurants.push(body);msg.className='message ok';msg.textContent='✓ Restaurante cadastrado!';e.target.reset();render();setTimeout(()=>{modal.classList.remove('open');msg.textContent=''},900)}catch(err){msg.className='message bad';msg.textContent=err.message}
  };
  load();
</script>
</body>
</html>
